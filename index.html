<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- Die App darf nur Dateien von ihrer eigenen Adresse laden und nichts ins Internet senden. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Finanzen</title>
  <meta name="description" content="Persönliches Haushaltsbuch. Alle Daten bleiben auf diesem Gerät.">
  <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzen">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <main id="view" class="view" tabindex="-1">
      <div class="boot">Lädt …</div>
    </main>
    <nav class="tabbar" aria-label="Hauptnavigation">
      <button class="tab" data-action="tab" data-tab="uebersicht" aria-label="Übersicht">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4v7H4zM10 8h4v12h-4zM16 4h4v16h-4z"/></svg>
        <span>Übersicht</span>
      </button>
      <button class="tab" data-action="tab" data-tab="buchungen" aria-label="Buchungen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Buchungen</span>
      </button>
      <button class="fab" data-action="new-entry" aria-label="Neue Ausgabe eintragen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-action="tab" data-tab="fixkosten" aria-label="Fixkosten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg>
        <span>Fixkosten</span>
      </button>
      <button class="tab" data-action="tab" data-tab="mehr" aria-label="Mehr">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>Mehr</span>
      </button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <dialog id="modal" class="modal"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript>Diese App braucht JavaScript.</noscript>
</body>
</html>
